services:
  floci:
    image: floci/floci:latest
    container_name: data-lab-floci
    ports:
      - "4566:4566"
    environment:
      FLOCI_STORAGE_MODE: persistent
      FLOCI_DEFAULT_REGION: us-east-1
    volumes:
      - floci-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  floci-data:
